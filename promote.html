<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Promote Your Business | GoGapo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- promote starts -->
    <section class="promote content-section" id="promote-page">

        <a href="index.html" class="promote-back">← Back to GoGapo</a>

        <div class="promote-intro">
            <p class="small-title">LIST YOUR BUSINESS</p>
            <h2>Promote Your Business</h2>
            <p>Give your local business more visibility with GoGapo.</p>
        </div>

        <form action="" method="post" class="promote-form">
            <label for="biz-name">Business Name</label>
            <input type="text" id="biz-name" name="business_name" required>

            <label for="biz-email">Business Email</label>
            <input type="email" id="biz-email" name="business_email" required>

            <label for="biz-address">Business Address</label>
            <input type="text" id="biz-address" name="business_address" required>

            <label for="biz-desc">Business Description</label>
            <textarea id="biz-desc" name="business_description" rows="5"
                placeholder="What do you offer? What makes your place special?"></textarea>

            <button type="submit">Request to promote</button>
            <p class="form-note">We'll review your request and get back to you by email.</p>
        </form>
    </section>
    <!-- promote ends -->

</body>

</html>
